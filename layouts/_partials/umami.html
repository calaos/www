{{- /* Off under hugo server, so that previews stay out of the statistics. The query
     string is not sent: it can carry the giscus session token (?giscus=). */ -}}
{{ with site.Params.umami }}{{ if and hugo.IsProduction .script .id }}<script defer src="{{ .script }}" data-website-id="{{ .id }}" data-exclude-search="true"></script>{{ end }}{{ end }}
