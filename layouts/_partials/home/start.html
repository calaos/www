<section id="{{ partial "section-id.html" (dict "name" "start" "id" .id) }}" style="background:var(--mist)"><div class="wrap start"><div><span class="eyebrow">{{ .eyebrow }}</span><h2>{{ partial "emphasis.html" (dict "text" .title "class" "mark") }}</h2><p style="color:var(--muted);margin-top:14px">{{ .text }}</p><div class="cta">{{ range $i, $b := .buttons }}<a class="btn {{ if $i }}btn-s{{ else }}btn-p{{ end }}" href="{{ .url }}">{{ with .icon }}{{ partial "icon.html" . }}{{ end }}{{ .label }}</a>{{ end }}</div></div>
<ol class="steps">{{ range $i, $s := .steps }}<li><b>{{ add $i 1 }}</b><div>{{ .title }}<span>{{ .text }}</span></div></li>{{ end }}</ol></div></section>
