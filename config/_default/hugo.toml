baseURL = "https://calaos.fr/"
title = "Calaos"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term", "sitemap", "404"]

# The home page has nothing to syndicate; sections keep Hugo's default RSS.
[outputs]
home = ["html"]

[pagination]
pagerSize = 10
# No page/1/ copy of the first page: it only redirects to the list.
disableAliases = true

[module.hugoVersion]
extended = true
min = "0.154.5"
