baseURL = "https://calaos.fr/"
title = "Calaos"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

# The home page has nothing to syndicate; sections keep Hugo's default RSS.
[outputs]
home = ["html"]

[pagination]
pagerSize = 10
# No page/1/ copy of the first page: it only redirects to the list.
disableAliases = true

[module.hugoVersion]
extended = true
min = "0.154.5"

# Mounting the default directories again is required: declaring one mount drops
# the defaults. static/media is also visible to the image pipeline (OG image,
# hero WebP, touch icon); it keeps being published as is from static/.
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "static/media"
target = "assets/media"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "static"
target = "static"
