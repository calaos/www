name: Deploy

# Manual only, never on push or pull request. The job `if` and the first step
# only guard against a dispatch from the wrong branch by mistake; the real
# boundary is the branch rule on the `deploy` environment, which holds the key.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deduced from doc-website's deploy step; correct it if the endpoint differs.
  DEPLOY_URL: https://www-upload.calaos.fr/deploy

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # `==` ignores case in expressions; the first step compares exactly.
    if: github.ref == 'refs/heads/master'
    environment: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the ref
        run: '[ "$GITHUB_REF" = refs/heads/master ] || { echo "::error::deploy runs on refs/heads/master only"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.154.5"
          extended: true
      - run: hugo --minify
      - name: Archive the site
        run: (cd public && tar --zstd -cf ../archive.tar.zst .)
      - name: Upload
        env:
          WWW_UPLOAD_KEY: ${{ secrets.WWW_UPLOAD_KEY }}
        # The key goes to curl on stdin (`key=<-`): not in argv, and no `@`, `<`,
        # `;`, `"` or `\` in it is reinterpreted. Only the final status is read, with
        # no --location: a 3xx would otherwise pass (curl exits 0) or resend the key.
        # The answer body stays out of the public log.
        run: |
          : "${WWW_UPLOAD_KEY:?missing upload key}"
          code=$(printf '%s' "$WWW_UPLOAD_KEY" \
            | curl --silent --show-error --proto '=https' --tlsv1.2 \
                --connect-timeout 30 --max-time 300 \
                --output /dev/null --write-out '%{http_code}' \
                --form 'key=<-' --form 'file=@archive.tar.zst' "$DEPLOY_URL")
          case "$code" in 2??) ;; *) echo "::error::upload answered HTTP $code"; exit 1 ;; esac
