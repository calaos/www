name: Deploy

# Manual only, never on push or pull request. The ref guard below keeps a
# dispatch from another branch from publishing unreviewed content.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Deduced from doc-website's deploy step; correct it if the endpoint differs.
  DEPLOY_URL: https://www-upload.calaos.fr/deploy

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.154.5"
          extended: true
      - run: hugo --minify
      - name: Archive the site
        run: (cd public && tar --zstd -cf ../archive.tar.zst .)
      - name: Upload
        env:
          WWW_UPLOAD_KEY: ${{ secrets.WWW_UPLOAD_KEY }}
        # --fail-with-body: a 4xx/5xx makes curl, hence the job, fail and prints
        # the answer. The key goes to curl on stdin (printf is a builtin), so it
        # is not in any argv; the log masks the secret.
        run: |
          printf 'form = "key=%s"\n' "$WWW_UPLOAD_KEY" \
            | curl --silent --show-error --fail-with-body --proto '=https' --tlsv1.2 \
                --config - --form 'file=@archive.tar.zst' "$DEPLOY_URL"
